name: Ascend
options:
  bundleIdPrefix: com.yang
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs.git
    revision: 4fbaf20184d62f82a9f44f343337c61a2c5483e9
targets:
  Ascend:
    type: application
    platform: macOS
    sources:
      - path: Ascend
    dependencies:
      - package: FSRS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yang.Ascend
        PRODUCT_NAME: 知境录
        PRODUCT_MODULE_NAME: Ascend
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 知境录
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "0.99.0"
        CURRENT_PROJECT_VERSION: "99"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.99.0"
        INFOPLIST_KEY_CFBundleVersion: "99"
        CODE_SIGN_ENTITLEMENTS: Ascend/Support/Ascend.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AscendTests
  AscendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AscendTests
    dependencies:
      - target: Ascend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yang.AscendTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/知境录.app/Contents/MacOS/知境录"
        BUNDLE_LOADER: "$(TEST_HOST)"
